name: Auto build on upstream release

# 每 6 小时检查上游最新 release；本仓库尚无对应 tag 时自动打 Android debug APK。

on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
    inputs:
      source_branch:
        description: '构建 fork 的哪个分支'
        required: false
        default: 'testing'
        type: string

permissions:
  contents: write

concurrency:
  group: auto-build-android
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Check upstream release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REL=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/SagerNet/sing-box/releases?per_page=1")
          TAG=$(printf '%s' "$REL" | jq -r '.[0].tag_name | ltrimstr("v")')
          PRE=$(printf '%s' "$REL" | jq -r '.[0].prerelease')
          if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
            echo "failed to resolve upstream latest release" >&2
            exit 1
          fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${TAG}")
          echo "upstream=v${TAG} prerelease=${PRE:-false} existing_release_http=${CODE}"
          {
            echo "tag=${TAG}"
            echo "prerelease=${PRE:-false}"
            if [ "${CODE}" = "404" ]; then echo "should_build=true"; else echo "should_build=false"; fi
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: ${{ needs.check.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.25'
          cache: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK / build-tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;28.0.13004108" "cmake;3.22.1" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -euo pipefail
          export SB_REPO="largerthanlife/sing-box"
          export SB_REF="${{ inputs.source_branch || 'testing' }}"
          export MERGE_TAG="v${{ needs.check.outputs.tag }}"
          export TAG_NAME="${{ needs.check.outputs.tag }}"
          export ANDROID_REF="dev"
          export BUILD_VARIANT="debug"
          bash "${GITHUB_WORKSPACE}/scripts/build-apk.sh"

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.tag }}
          prerelease: ${{ needs.check.outputs.prerelease == 'true' }}
          files: sing-box-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
