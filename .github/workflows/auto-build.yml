name: Auto build on upstream release

# 每 6 小时检查一次 SagerNet/sing-box 最近 release：
# - 最新上游若本仓库还没有 Release，或有 Release 但缺 .tipa → 编 tipa
# - 再往前若干条：仅当已有 Release 缺 .tipa 时补编（不给从未跟过的老版本开新坑）
# 与 Android workflow 共用同一 Release tag，各自补自己的产物。

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      source_branch:
        description: '构建 fork 的哪个分支'
        required: false
        default: 'testing'
        type: string

permissions:
  contents: write

concurrency:
  group: auto-build
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      matrix: ${{ steps.check.outputs.matrix }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Check upstream releases for missing tipa
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash "${GITHUB_WORKSPACE}/scripts/check-auto-build.sh" tipa

  build:
    needs: check
    if: ${{ needs.check.outputs.should_build == 'true' }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check.outputs.matrix) }}

    steps:
      - name: Checkout this repo
        uses: actions/checkout@main

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ^1.25
          cache: false

      - name: Setup Xcode stable
        run: |-
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version >> $GITHUB_STEP_SUMMARY

      - name: Install ldid (via brew)
        run: |
          brew install ldid

      - name: Cache Go and Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Caches/sing-box-source-packages
          key: ${{ runner.os }}-buildcache-${{ github.run_id }}-${{ matrix.tag }}
          restore-keys: |
            ${{ runner.os }}-buildcache-

      - name: Build TIPA
        run: |
          set -euo pipefail
          export SB_REPO="largerthanlife/sing-box"
          export SB_REF="${{ inputs.source_branch || 'testing' }}"
          export MERGE_TAG="v${{ matrix.tag }}"
          export TAG_NAME="${{ matrix.tag }}"
          export UPDATE_APPLE="true"
          export BUNDLE_ID="io.nekohasekai.sfavt"
          export BASE_PACKAGE_IDENTIFIER="io.nekohasekai.sfavt"
          bash "${GITHUB_WORKSPACE}/scripts/build-tipa.sh"

      - name: Create Release and Upload TIPA
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ matrix.tag }}
          name: ${{ matrix.tag }}
          prerelease: ${{ matrix.prerelease == 'true' }}
          files: sing-box-*.tipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
