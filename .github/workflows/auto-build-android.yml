name: Auto build Android on upstream release

# 每 6 小时检查上游最近 release：
# - 最新上游若无 Release 或有 Release 但缺 .apk → 编 APK
# - 已有 tipa、缺 apk 的版本会补传（解决 iOS 先建 Release 导致 Android 整段跳过）

on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
    inputs:
      source_branch:
        description: '构建 fork 的哪个分支'
        required: false
        default: 'testing'
        type: string

permissions:
  contents: write

concurrency:
  group: auto-build-android
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      matrix: ${{ steps.check.outputs.matrix }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Check upstream releases for missing apk
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash "${GITHUB_WORKSPACE}/scripts/check-auto-build.sh" apk

  build:
    needs: check
    if: ${{ needs.check.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check.outputs.matrix) }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.25'
          cache: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK / build-tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;28.0.13004108" "cmake;3.22.1" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -euo pipefail
          export SB_REPO="largerthanlife/sing-box"
          export SB_REF="${{ inputs.source_branch || 'testing' }}"
          export MERGE_TAG="v${{ matrix.tag }}"
          export TAG_NAME="${{ matrix.tag }}"
          export ANDROID_REF="dev"
          export BUILD_VARIANT="debug"
          export APK_ABIS="arm64-v8a,x86_64"
          export APK_INCLUDE_LEGACY="false"
          export APK_INCLUDE_UNIVERSAL="false"
          bash "${GITHUB_WORKSPACE}/scripts/build-apk.sh"

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ matrix.tag }}
          name: ${{ matrix.tag }}
          prerelease: ${{ matrix.prerelease == 'true' }}
          files: sing-box-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
