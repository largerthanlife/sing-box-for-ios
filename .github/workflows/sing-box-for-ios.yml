name: Build sing-box-for-ios

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '输入版本号 (例：1.12.0)'
        required: true
        type: string
      sing_box_repo:
        description: 'sing-box 源码仓库 (owner/repo)'
        required: false
        default: 'largerthanlife/sing-box'
        type: string
      sing_box_ref:
        description: 'fork 的分支或 tag（overlay 文件从这里取；留空则 v<版本号>）'
        required: false
        default: 'testing'
        type: string
      upstream_tag:
        description: '合入的上游 tag 或分支。留空表示直接编译 sing_box_ref，不合入。需要把自有文件叠到上游树上时再填，例如 testing'
        required: false
        default: ''
        type: string
      prerelease:
        description: '是否发布为测试版? (true/false)'
        required: false
        default: 'false'  # 默认为 false
        type: choice
        options:
          - 'true'
          - 'false'
      update_apple:
        description: '按 Libbox 配 apple 客户端。自定义分支请选 true：会用最近发版 tag 的 Bump version，而不是仓库里钉住的 submodule。选 false 会编到对不上的旧客户端'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      run_build:
        description: '是否编译 原版 ?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      run_build_reF1nd:
        description: '是否编译 reF1nd ?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'


permissions:
  contents: write  # 重要：允许创建 release

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout this repo
        uses: actions/checkout@main

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ^1.25
          cache: false  # Go 项目 clone 在 $HOME，setup-go 找不到 go.sum；统一用下面的 cache

      - name: Setup Xcode stable
        run: |-
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version >> $GITHUB_STEP_SUMMARY

      - name: Install ldid (via brew)
        run: |
          brew install ldid

      # runner 每次全新：恢复上次构建的 Go module/build 缓存，避免 gomobile 全量重编。
      # SwiftPM checkout 不缓存：浮动解析曾把 DisplayLink 3 写进这个目录，下次会沿用并再次把 xcodebuild 打崩。
      - name: Cache Go and Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: ${{ runner.os }}-buildcache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-buildcache-

      - name: Build TIPA
        if: ${{ inputs.run_build == 'true' }}
        run: |
          set -euo pipefail
          source "${GITHUB_WORKSPACE}/scripts/resolve-source.sh" "${{ inputs.sing_box_repo }}" "${{ inputs.sing_box_ref }}" "${{ inputs.tag_name }}" "${{ inputs.upstream_tag }}"
          export TAG_NAME="${{ inputs.tag_name }}"
          export UPDATE_APPLE="${{ inputs.update_apple }}"
          bash "${GITHUB_WORKSPACE}/scripts/build-tipa.sh"

      - name: Build TIPA reF1nd
        if: ${{ inputs.run_build_reF1nd == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          export SB_REPO="reF1nd/sing-box"
          export SB_REF="v${{ inputs.tag_name }}-reF1nd"
          export TAG_NAME="${{ inputs.tag_name }}"
          export UPDATE_APPLE="${{ inputs.update_apple }}"
          export BUILD_LABEL="sing-box-reF1nd"
          export DISPLAY_SUFFIX="-reF1nd"
          export BUNDLE_ID="io.nekohasekai.sfavt-reF1nd"
          export OUTPUT_NAME="sing-box-reF1nd-${{ inputs.tag_name }}.tipa"
          bash "${GITHUB_WORKSPACE}/scripts/build-tipa.sh"

      # 原版 tipa 编成功就发版；reF1nd 找不到对应 tag 时不应挡住上传
      - name: Create Release and Upload TIPA
        if: ${{ hashFiles('sing-box-*.tipa') != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.tag_name }}
          name: ${{ inputs.tag_name }}
          prerelease: ${{ inputs.prerelease == 'true' }}
          files: sing-box-*.tipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Old Workflows
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 7
          keep_minimum_runs: 7
