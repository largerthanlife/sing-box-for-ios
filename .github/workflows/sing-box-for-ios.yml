name: Build sing-box-for-ios

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '输入版本号 (例：1.12.0)'
        required: true
        type: string
      sing_box_repo:
        description: 'sing-box 源码仓库 (owner/repo)'
        required: false
        default: 'largerthanlife/sing-box'
        type: string
      sing_box_ref:
        description: 'sing-box 分支或 tag (留空则使用 v<版本号>)'
        required: false
        default: ''
        type: string
      upstream_tag:
        description: '可选: clone 后合入的上游 tag (例 v1.14.0-beta.9)，用于在自定义分支上叠加最新上游版本'
        required: false
        default: ''
        type: string
      prerelease:
        description: '是否发布为测试版? (true/false)'
        required: false
        default: 'false'  # 默认为 false
        type: choice
        options:
          - 'true'
          - 'false'
      update_apple:
        description: '是否重新拉取最新 sing-box-for-apple 仓库?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      run_build:
        description: '是否编译 原版 ?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      run_build_reF1nd:
        description: '是否编译 reF1nd ?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'


permissions:
  contents: write  # 重要：允许创建 release

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout this repo
        uses: actions/checkout@main

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ^1.25
          cache: false  # Go 项目 clone 在 $HOME，setup-go 找不到 go.sum；统一用下面的 cache

      - name: Setup Xcode stable
        run: |-
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version >> $GITHUB_STEP_SUMMARY

      - name: Install ldid (via brew)
        run: |
          brew install ldid

      # runner 每次全新：恢复上次构建的 Go module/build 缓存与 SwiftPM checkout，
      # 避免 gomobile 全量重编和 Swift 依赖重新下载（约占一半构建时间）
      - name: Cache Go and Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Caches/sing-box-source-packages
          key: ${{ runner.os }}-buildcache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-buildcache-

      - name: Build TIPA
        if: ${{ inputs.run_build == 'true' }}
        run: |
          set -euo pipefail
          source "${GITHUB_WORKSPACE}/scripts/resolve-source.sh" "${{ inputs.sing_box_repo }}" "${{ inputs.sing_box_ref }}" "${{ inputs.tag_name }}" "${{ inputs.upstream_tag }}"
          export TAG_NAME="${{ inputs.tag_name }}"
          export UPDATE_APPLE="${{ inputs.update_apple }}"
          bash "${GITHUB_WORKSPACE}/scripts/build-tipa.sh"

      - name: Build TIPA reF1nd
        if: ${{ inputs.run_build_reF1nd == 'true' }}
        run: |
          set -euo pipefail
          export SB_REPO="reF1nd/sing-box"
          export SB_REF="v${{ inputs.tag_name }}-reF1nd"
          export TAG_NAME="${{ inputs.tag_name }}"
          export UPDATE_APPLE="${{ inputs.update_apple }}"
          export BUILD_LABEL="sing-box-reF1nd"
          export DISPLAY_SUFFIX="-reF1nd"
          export BUNDLE_ID="io.nekohasekai.sfavt-reF1nd"
          export OUTPUT_NAME="sing-box-reF1nd-${{ inputs.tag_name }}.tipa"
          bash "${GITHUB_WORKSPACE}/scripts/build-tipa.sh"

      - name: Create Release and Upload TIPA
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.tag_name }}
          name: ${{ inputs.tag_name }}
          prerelease: ${{ inputs.prerelease == 'true' }}
          files: sing-box-*.tipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Old Workflows
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 7
          keep_minimum_runs: 7
