name: Test scripts

on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/test-scripts.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/test-scripts.yml'
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@main

      - name: Run resolve-source tests
        run: bash scripts/test-resolve-source.sh

      - name: Run prepare-source integration tests
        run: bash scripts/test-prepare-source.sh

      - name: Run apple patch tests
        run: bash scripts/test-apple-patches.sh

      - name: Run android script smoke tests
        run: bash scripts/test-android-scripts.sh

      - name: Run auto-build missing-asset check tests
        run: bash scripts/test-check-auto-build.sh
